<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/geotrainer/">
    <title>GeoTrainer PRO</title>
    <script>
        var hash = window.location.hash;
        var search = window.location.search;
        var targetUrl = '/geotrainer/';
        if (hash) targetUrl += hash;
        if (search && search !== '?') targetUrl += search;
        window.location.href = targetUrl;
        setTimeout(function() { window.location.replace(targetUrl); }, 100);
    </script>
</head>
<body>
    <p>Перенаправление на главную...</p>
</body>
</html>
